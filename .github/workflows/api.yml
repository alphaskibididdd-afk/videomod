name: api-dump
on: [workflow_dispatch, push]

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew compileJava || true
      - name: dump
        run: |
          {
            M=$(find ~/.gradle -name 'mcef-modern*.jar' ! -name '*sources*' | head -1)
            echo "MCEF jar: $M"
            echo "--- Klassen ---"
            unzip -l "$M" | awk '{print $4}' | grep -E '^net/dimaskama/.*\.class$' | head -150
            echo "--- API ---"
            for c in $(unzip -l "$M" | awk '{print $4}' | grep -E 'net/dimaskama/.*(Browser|Api|MCEF)[^/]*\.class$' | sed 's/\.class$//' | tr / .); do
              javap -public -cp "$M" "$c"
            done
            echo "--- Minecraft blit ---"
            for j in $(find ~/.gradle -name '*.jar'); do
              if unzip -l "$j" 2>/dev/null | grep -q 'gui/GuiGraphicsExtractor.class'; then
                echo "MC: $j"
                javap -public -cp "$j" net.minecraft.client.gui.GuiGraphicsExtractor | grep -i blit
                break
              fi
            done
          } > dump.txt 2>&1
          cat dump.txt
          { echo '~~~'; cat dump.txt; echo '~~~'; } >> "$GITHUB_STEP_SUMMARY"
