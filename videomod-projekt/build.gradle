plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = 'de.videomod'

repositories {
    maven { url = uri('https://maven.dimaskama.net/releases') }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.dimaskama:mcef-modern:${project.mcef_modern_version}"

    // Alles in EINE Jar packen, damit nur diese Datei in den mods-Ordner muss
    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    include "net.dimaskama:mcef-modern:${project.mcef_modern_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
